name: Docker Build and Push
on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      password:
        required: false
        type: string
      username:
        required: false
        type: string
      platforms:
        required: false
        type: string
      build_args:
        required: false
        type: string
        default: ""
      build_contexts:
        required: false
        type: string
        default: ""
      id:
        required: false
        type: string
        default: "0"
      context:
        required: false
        type: string
        default: .
      tag:
        required: false
        type: string
        default: ""
      arm64_runner:
        required: false
        type: string
        default: "ubuntu-24.04-arm"
      amd64_runner:
        required: false
        type: string
        default: "ubuntu-24.04"
      # Must end in scope=<name> (or ref=<name> for a registry cache): the build step appends
      # -<runner> to it, so each platform gets its own cache. Empty means a gha cache scoped by id.
      cache_from:
        required: false
        type: string
        default: ""
      cache_to:
        required: false
        type: string
        default: ""
    secrets:
      service_account_key:
        required: false
      git_submodule_token:
        required: false
      docker_registry_token:
        required: false
      dockerhub_username:
        required: false
      dockerhub_token:
        required: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ inputs.amd64_runner }}
          - platform: linux/arm64
            runner: ${{ inputs.arm64_runner }}

    name: Build and push ${{ inputs.image_name }} for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.git_submodule_token || github.token }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Prepare.
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up QEMU.
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry.
        uses: FhenixProtocol/actions/.github/actions/registry-login@2.x.x
        with:
          service_account_key: ${{ secrets.service_account_key }}
          registry: ${{ inputs.registry }}
          docker_registry_token: ${{ secrets.docker_registry_token }}

      - name: Extract metadata (tags, labels) Docker image.
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}

      - name: Build and push  ${{ inputs.image_name }} Docker image.
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.registry }}/${{ inputs.image_name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          build-contexts: ${{ inputs.build_contexts }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # A bare "type=gha" default made this "type=gha-<runner>" (an invalid importer) and left both
          # platforms writing one scope, where their races failed builds with "failed to reserve cache".
          # ignore-error: a cache write must never fail an image build.
          cache-from: ${{ inputs.cache_from || format('type=gha,scope={0}', inputs.id) }}-${{ matrix.runner }}
          cache-to: ${{ inputs.cache_to || format('type=gha,mode=max,scope={0}', inputs.id) }}-${{ matrix.runner }},ignore-error=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}-${{ inputs.id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Push digests
        uses: FhenixProtocol/actions/.github/actions/push-digests@2.x.x
        with:
          registry: ${{ inputs.registry }}
          image_name: "${{ inputs.image_name }}"
          service_account_key: ${{ secrets.service_account_key }}
          docker_registry_token: ${{ secrets.docker_registry_token }}
          runs_on: "ubuntu-latest"
          id: ${{ inputs.id }}
          tag: ${{ inputs.tag }}
